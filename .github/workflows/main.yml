name: CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NAMESPACE: default

jobs:
  # ============================================================
  # BUILD + PUSH
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPOSITORY}-${{ matrix.service }}"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Image: $IMAGE_NAME"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Minikube

    needs:
      - build

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # PATH
      # --------------------------------------------------------
      - name: Add Homebrew to PATH
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------------
      # CHECK CLUSTER
      # --------------------------------------------------------
      - name: Check Kubernetes
        shell: bash
        run: |
          echo "=== Context ==="
          kubectl config current-context

          echo "=== Nodes ==="
          kubectl get nodes

      # --------------------------------------------------------
      # WAIT FOR INGRESS
      # --------------------------------------------------------
      - name: Wait for ingress controller
        shell: bash
        run: |
          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=available \
            deployment/ingress-nginx-controller \
            --timeout=180s

      # --------------------------------------------------------
      # PRIVATE GHCR AUTH
      # --------------------------------------------------------
      - name: Configure private GHCR access
        shell: bash
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client \
            -o yaml \
            | kubectl apply -f -

      # --------------------------------------------------------
      # ATTACH PULL SECRET TO DEFAULT SERVICE ACCOUNT
      # --------------------------------------------------------
      - name: Configure image pull secret
        shell: bash
        run: |
          kubectl patch serviceaccount default \
            --namespace "$NAMESPACE" \
            --type=merge \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}'

          kubectl get serviceaccount default \
            --namespace "$NAMESPACE" \
            -o yaml

      # --------------------------------------------------------
      # IMAGE NAMES
      # --------------------------------------------------------
      - name: Prepare image names
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          API_IMAGE="ghcr.io/${REPOSITORY}-api:${GITHUB_SHA}"
          WORKER_IMAGE="ghcr.io/${REPOSITORY}-worker:${GITHUB_SHA}"

          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

          echo "API: $API_IMAGE"
          echo "Worker: $WORKER_IMAGE"

      # --------------------------------------------------------
      # APPLY MANIFESTS
      # --------------------------------------------------------
      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          kubectl apply \
            --namespace "$NAMESPACE" \
            -f manifests/

      # --------------------------------------------------------
      # SET EXACT IMAGE VERSION
      # --------------------------------------------------------
      - name: Deploy API image
        shell: bash
        run: |
          kubectl set image deployment/api \
            api="$API_IMAGE" \
            --namespace "$NAMESPACE"

      - name: Deploy Worker image
        shell: bash
        run: |
          kubectl set image deployment/worker \
            worker="$WORKER_IMAGE" \
            --namespace "$NAMESPACE"

      # --------------------------------------------------------
      # WAIT FOR ROLLOUT
      # --------------------------------------------------------
      - name: Wait for API rollout
        shell: bash
        run: |
          kubectl rollout status deployment/api \
            --namespace "$NAMESPACE" \
            --timeout=180s

      - name: Wait for Worker rollout
        shell: bash
        run: |
          kubectl rollout status deployment/worker \
            --namespace "$NAMESPACE" \
            --timeout=180s

      # --------------------------------------------------------
      # RESULT
      # --------------------------------------------------------
      - name: Show deployment status
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods \
            --namespace "$NAMESPACE"

          echo
          echo "=== Deployments ==="
          kubectl get deployments \
            --namespace "$NAMESPACE"

          echo
          echo "=== API image ==="
          kubectl get deployment api \
            --namespace "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo
          echo "=== Worker image ==="
          kubectl get deployment worker \
            --namespace "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'