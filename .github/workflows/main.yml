name: CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NAMESPACE: default

jobs:
  # ============================================================
  # BUILD + PUSH API / WORKER
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPOSITORY}-${{ matrix.service }}"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Image name: $IMAGE_NAME"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================================
  # DEPLOY TO LOCAL MINIKUBE
  # ============================================================
  deploy:
    name: Deploy to Minikube

    needs:
      - build

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Add Homebrew to PATH
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Check tools
        shell: bash
        run: |
          echo "=== kubectl ==="
          kubectl version --client

          echo "=== Docker ==="
          docker version

          echo "=== Kubernetes context ==="
          kubectl config current-context

          echo "=== Nodes ==="
          kubectl get nodes

      - name: Prepare image names
        shell: bash
        run: |
          REPOSITORY=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')

          API_IMAGE="ghcr.io/${REPOSITORY}-api:${GITHUB_SHA}"
          WORKER_IMAGE="ghcr.io/${REPOSITORY}-worker:${GITHUB_SHA}"

          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WORKER_IMAGE=$WORKER_IMAGE" >> "$GITHUB_ENV"

          echo "API image: $API_IMAGE"
          echo "Worker image: $WORKER_IMAGE"

      - name: Apply Kubernetes manifests
        shell: bash
        run: |
          kubectl apply \
            -n "$NAMESPACE" \
            -f manifests/

      - name: Update API image
        shell: bash
        run: |
          kubectl set image deployment/api \
            api="$API_IMAGE" \
            -n "$NAMESPACE"

      - name: Update Worker image
        shell: bash
        run: |
          kubectl set image deployment/worker \
            worker="$WORKER_IMAGE" \
            -n "$NAMESPACE"

      - name: Wait for API rollout
        shell: bash
        run: |
          kubectl rollout status deployment/api \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Wait for Worker rollout
        shell: bash
        run: |
          kubectl rollout status deployment/worker \
            -n "$NAMESPACE" \
            --timeout=180s

      - name: Show deployed resources
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$NAMESPACE"

          echo
          echo "=== Deployments ==="
          kubectl get deployments -n "$NAMESPACE"

          echo
          echo "=== Services ==="
          kubectl get services -n "$NAMESPACE"

          echo
          echo "=== API image ==="
          kubectl get deployment api \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

          echo
          echo "=== Worker image ==="
          kubectl get deployment worker \
            -n "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'